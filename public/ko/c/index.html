","desc":"서두르지 않아서 함께 있으면 편안해요. 친구의 이야기를 끝까지 들어 줘요. 하고 싶은 일 하나는 오늘 바로 시작해 보세요."},"CIT":{"name":"별자리 고슴도치","one":"엉뚱한 점을 이어 그림을 만드는 사람","desc":"남들이 생각 못 한 연결을 찾아내요. 혼자만의 시간에 아이디어가 쌓여요. 떠오른 아이디어를 친구 한 명에게 꼭 말해 보세요."}},"cta":{"save":"카드 저장","share":"공유하기","chem":"친구랑 케미 보기","retry":"다시 하기"},"chem":{"title":"친구 케미","h1":"우리 둘, 어떤 조합일까?","intro":"내 캐릭터로 초대 링크를 만들어 친구에게 보내세요. 친구가 10문항을 풀면 둘의 조합 이름, 각자의 역할, 같이 하면 좋은 놀이가 열려요. 점수로 궁합을 매기지 않아요.","steps":["내 캐릭터 테스트 (10문항)","초대 링크 만들기","친구가 링크에서 테스트","둘의 케미 공개"],"needQuiz":"먼저 내 캐릭터 테스트를 해 주세요.","mine":"내 캐릭터","nickLabel":"별명 (선택, 12자까지)","nickDefault":"친구1","create":"초대 링크 만들기","linkReady":"초대 링크가 준비됐어요","inviteText":"우리 케미 궁금해? 10문항만 하면 바로 나와 → {url}","invitedBy":"{nick}님이 케미를 보자고 해요","invitedSub":"10문항을 풀면 둘의 조합이 바로 열려요. 상대의 캐릭터는 그때 공개돼요.","joinNick":"내 별명 (선택)","join":"케미 보기","members":"참여한 친구","empty":"아직 아무도 참여하지 않았어요. 새로고침해서 확인하세요.","refresh":"새로고침","deleteInvite":"초대 삭제","deleteConfirm":"초대를 삭제할까요? 링크가 바로 사라져요.","leave":"내 결과 빼기","left":"내 결과를 뺐어요.","full":"이 초대는 정원(8명)이 찼어요.","expires":"초대 링크는 7일 뒤 만료돼요.","you":"나","friend":"친구","rolesTitle":"둘의 역할","playTitle":"같이 하면 좋은 놀이","careTitle":"조심할 점","combos":["거울 듀오","머리와 마음 콤비","지도와 나침반","반전 짝꿍","무대와 객석","균형 저울","해와 달","퍼즐 조각"],"roles":{"S":"분위기 담당","C":"속도 조절 담당","SS":"둘 다 분위기 담당","CC":"둘 다 아늑함 담당","P":"계획 담당","I":"아이디어 담당","PP":"둘 다 계획파","II":"둘 다 즉흥파","H":"공감 담당","T":"해결 담당","HH":"둘 다 공감파","TT":"둘 다 해결파"},"plays":["협동 게임","방탈출","여행 계획","퀴즈 대결","노래방","보드게임","산책","게이트 러시 도전 링크 대결"],"care":{"prog":"약속 시간은 계획 담당이 정하기","judge":"고민 상담 땐 공감 먼저","same":"가끔은 다른 친구도 초대하기","none":"서로의 속도를 한 번씩 물어보기"},"playGame":"게이트 러시로 대결하기","cardCta":"우리 케미 궁금해?"},"about":{"h1":"매일웹겜 소개","body":["매일웹겜은 설치·가입 없이 브라우저에서 바로 즐기는 놀이 사이트예요. 30초 게임 '게이트 러시', 10문항 '나의 놀이 캐릭터' 테스트, 친구와 조합을 보는 '친구 케미' 세 가지만 있어요.","캐릭터 테스트와 케미는 재미로 보는 오락 콘텐츠예요. 정식 성격검사나 심리검사가 아니며 진단·채용·연애 판단에 쓰지 마세요.","모든 캐릭터 그림은 매일웹겜이 직접 만든 것이에요. 문의: playtoday.cloud"]},"privacy":{"h1":"개인정보 처리방침","body":["저장하는 것: 공유하거나 초대할 때만 별명(선택), 유형 코드, 게임 기록, 생성 시각을 저장해요.","저장하지 않는 것: 이름·연락처·생년월일·이메일·계정, 테스트 응답 원문, IP 원문. (남용 방지를 위해 IP는 해시로 1시간만 셉니다.)","보관 기간: 공유 결과 90일, 초대 7일 뒤 비공개. 만든 사람과 참여자는 언제든 직접 삭제할 수 있어요.","공유 링크와 미리보기 이미지에는 별명과 응답이 들어가지 않아요. 초대·결과 페이지는 검색에 노출되지 않아요.","공유는 언제나 선택이에요. 공유하지 않아도 내 결과는 모두 볼 수 있어요. 쿠키 광고 추적은 쓰지 않아요.","방문 수와 버튼 클릭 같은 익명 통계를 쿠키 없이 집계해요. 이름·결과 내용·개인 식별 정보는 보내지 않아요."]}}</script>
