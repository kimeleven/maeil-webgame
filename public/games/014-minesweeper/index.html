<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#141311"/><title>지뢰찾기 — 매일웹겜</title><meta name="description" content="클래식 지뢰찾기! 지뢰를 피해 칸을 열고, 숫자 힌트로 지뢰 위치를 추론하세요. 빠르고 정확하게 클리어할수록 고득점!"/><link rel="canonical" href="https://www.playtoday.cloud/games/014-minesweeper/"/><link rel="stylesheet" href="game.css"/></head>
<body><div id="wrap">
<canvas id="fx" aria-hidden="true"></canvas>
<div id="hud"><span>점수 <b id="score">0</b></span><span>지뢰 <b id="mines">10</b></span><span>시간 <b id="time">0</b></span><span>최고 <b id="best">0</b></span></div>
<a class="back" href="/">로비</a><button id="btn-fav" type="button">☆</button>
<div id="board-wrap"><div id="board" role="grid" aria-label="지뢰찾기 보드"></div></div>
<div id="toolbar"><button type="button" id="btn-mode" class="mode" aria-pressed="false">🚩 깃발 모드</button><button type="button" id="btn-reset" class="ghost-btn">다시 깔기</button></div>
<div id="start" class="overlay"><p class="kicker">오늘의 한 판 · 클래식/보드</p><h1>지뢰찾기</h1><p>칸을 <b>탭</b>해 열고,<br><b>길게 누르거나 깃발 모드</b>로 지뢰를 표시하세요.<br>숫자 힌트로 추론해 빠르게 클리어!</p><div data-maeil-nick></div><button id="btn-play">시작</button></div>
<div id="results" class="overlay" hidden><h1 id="result-title">결과</h1><p>점수 <b id="final-score">0</b></p><p class="sub" id="result-detail"></p><p class="sub" id="new-high" hidden>새 최고 기록!</p><div class="row"><button type="button" id="share-btn" class="share-btn" data-maeil-share>자랑하기</button><button id="btn-again">다시</button><a class="ghost" href="/">로비</a></div></div>
</div><script src="/js/guest.js"></script><script src="/js/share.js"></script><script src="game.js"></script></body></html>
