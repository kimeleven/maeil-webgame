# 매일웹겜 playtoday.cloud (t_a6a9cd42). vercel.json 재현. certbot --nginx가 443 블록을 덧붙인다.
# Vercel처럼 루트 → www 308
server {
    listen 80;
    listen [::]:80;
    server_name playtoday.cloud;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://www.playtoday.cloud$request_uri; }
}

# 정적: /srv/maeil/current/public, API: 127.0.0.1:3102 (maeil-api.service, 포트 3102 = OCI_공통배포 배정)
server {
    listen 80;
    listen [::]:80;
    server_name www.playtoday.cloud maeil.193-123-228-142.sslip.io;

    root /srv/maeil/current/public;
    index index.html;
    charset utf-8;
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json application/xml text/plain;
    gzip_min_length 1024;
    # mime.types(http 블록) 유지. webmanifest만 따로
    location ~ \.webmanifest$ { types { } default_type application/manifest+json; }
    error_page 403 = @nf;
    location @nf { return 404; }

    # Vercel 기본과 같게: 매번 재검증 (ETag)
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;

    # vercel.json redirects
    location = /games { return 301 /ko/; }
    location ^~ /games/ { return 301 /ko/; }

    # Vercel Web Analytics는 OCI에서 동작하지 않음 → 404 대신 빈 응답
    location = /_vercel/insights/script.js { default_type text/javascript; add_header Cache-Control "public, max-age=3600" always; return 200 ""; }
    location ^~ /_vercel/ { return 204; }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options nosniff always;  # 앱이 Cache-Control을 직접 보냄
    }

    # 공유·초대·도전 셸 (vercel.json rewrites + headers)
    location ~ ^/(ko|en|ja|zh-hans|es|pt-br)/c/mh-[^/]+/?$ {
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag noindex always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        rewrite ^/([^/]+)/ /$1/c/mh/index.html break;
    }
    location ~ ^/(ko|en|ja|zh-hans|es|pt-br)/(r|c|i)/ {
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag noindex always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /$1/$2/index.html =404;
    }

    location ~ /\.(?!well-known) { return 404; }
    location / { try_files $uri $uri/ =404; }
}
